# One command, fully local:  docker compose up --build
# App: http://localhost:8000   ·   API docs: http://localhost:8000/api-docs
name: dogfood

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dogfood
      POSTGRES_USER: dogfood
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dogfood-local-only}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dogfood -d dogfood"]
      interval: 3s
      timeout: 3s
      retries: 30
    # Not published to the host, and on a network with no route out.
    networks: [backend]
    restart: unless-stopped

  app:
    build: .
    image: dogfood-portal:local
    depends_on:
      db:
        condition: service_healthy
      # Optional AI sidecar (profile `ai`). required:false keeps `docker
      # compose up` working when the profile is not enabled.
      ai:
        condition: service_started
        required: false
    environment:
      DATABASE_URL: postgres://dogfood:${POSTGRES_PASSWORD:-dogfood-local-only}@db:5432/dogfood
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
      # Optional AI. Off by default; the app degrades gracefully either way.
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai:8080}
      AI_SERVICE_KEY: ${AI_SERVICE_KEY:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-5000}
      # Leave empty to generate a random secret on first boot (stored in the DB).
      APP_SECRET: ${APP_SECRET:-}
      SEED_ON_BOOT: ${SEED_ON_BOOT:-true}
      CHECKER_SESSIONS: ${CHECKER_SESSIONS:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      WEBHOOK_WORKER: "true"
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - uploads:/app/data/uploads
    # Lets webhooks reach receivers running on the host (e.g. the acceptance runner).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [backend, edge]
    restart: unless-stopped

  # Optional AI sidecar. Independent and offline-capable; never started by
  # plain `docker compose up`. Enable with `docker compose --profile ai up`.
  # See docs/20-ai-service.md for the device/model caveats.
  ai:
    profiles: [ai]
    build:
      context: ./src/ai
      args:
        INSTALL_MODELS: ${AI_INSTALL_MODELS:-0}
    image: dogfood-ai:local
    environment:
      AI_DEVICE: ${AI_DEVICE:-auto}
      AI_CLASSIFIER_BACKEND: ${AI_CLASSIFIER_BACKEND:-heuristic}
      AI_GENERATOR_BACKEND: ${AI_GENERATOR_BACKEND:-heuristic}
      AI_CLASSIFIER_MODEL: ${AI_CLASSIFIER_MODEL:-convaiinnovations/laya}
      AI_SUMMARY_MODEL: ${AI_SUMMARY_MODEL:-gemma-4-E2B}
      AI_FEEDBACK_MODEL: ${AI_FEEDBACK_MODEL:-gemma-4-E4B}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      AI_SERVICE_KEY: ${AI_SERVICE_KEY:-}
      AI_MAX_BATCH: ${AI_MAX_BATCH:-64}
      HF_HOME: /models
      # Offline by default; override to 0 only for one-time provisioning.
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
    volumes:
      # Pre-provisioned weights only; the image never downloads at runtime.
      - ai-models:/models
    ports:
      - "${AI_PORT:-8080}:8080"
    extra_hosts:
      # Lets the Gemma/Ollama backend reach an Ollama running on the host.
      - "host.docker.internal:host-gateway"
    networks: [backend, edge]
    restart: unless-stopped

  # Dev-only Postgres for `pnpm dev` (API + Vite on the host). Not started by
  # plain `docker compose up`; host port 5433 so it never clashes with a local 5432.
  devdb:
    image: postgres:16-alpine
    profiles: [dev]
    environment:
      POSTGRES_DB: dogfood
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-5433}:5432"
    volumes:
      - devdb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dogfood"]
      interval: 2s
      timeout: 3s
      retries: 30

networks:
  backend:
    internal: true
  edge: {}

volumes:
  db-data:
  uploads:
  devdb-data:
  ai-models:
