# One command, fully local:  docker compose up --build
# App: http://localhost:8000   ·   API docs: http://localhost:8000/api-docs
name: dogfood

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dogfood
      POSTGRES_USER: dogfood
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dogfood-local-only}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dogfood -d dogfood"]
      interval: 3s
      timeout: 3s
      retries: 30
    # Not published to the host, and on a network with no route out.
    networks: [backend]
    restart: unless-stopped

  app:
    build: .
    image: dogfood-portal:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dogfood:${POSTGRES_PASSWORD:-dogfood-local-only}@db:5432/dogfood
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
      # Leave empty to generate a random secret on first boot (stored in the DB).
      APP_SECRET: ${APP_SECRET:-}
      SEED_ON_BOOT: ${SEED_ON_BOOT:-true}
      CHECKER_SESSIONS: ${CHECKER_SESSIONS:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      WEBHOOK_WORKER: "true"
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - uploads:/app/data/uploads
    # Lets webhooks reach receivers running on the host (e.g. the acceptance runner).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [backend, edge]
    restart: unless-stopped

  # Dev-only Postgres for `pnpm dev` (API + Vite on the host). Not started by
  # plain `docker compose up`; host port 5433 so it never clashes with a local 5432.
  devdb:
    image: postgres:16-alpine
    profiles: [dev]
    environment:
      POSTGRES_DB: dogfood
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-5433}:5432"
    volumes:
      - devdb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dogfood"]
      interval: 2s
      timeout: 3s
      retries: 30

networks:
  backend:
    internal: true
  edge: {}

volumes:
  db-data:
  uploads:
  devdb-data:
