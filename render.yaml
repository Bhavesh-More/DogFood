# Render Blueprint — API (Docker) + free Postgres 16.
# Dashboard → New → Blueprint → pick this repo. See docs/23-deployment.md §4.
#
# The Vercel frontend proxies /api, /uploads and /.well-known to the API service
# (src/web/vercel.json), so the browser stays same-origin and cookie auth + CSRF
# work unchanged.

databases:
  - name: dogfood-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: dogfood-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Set this to the Vercel URL (https://your-app.vercel.app) after step 4.2.
      # It drives invite links and the CSRF origin allow-list.
      - key: PUBLIC_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: dogfood-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      # Never expose the public checker tokens on a hosted instance.
      - key: CHECKER_SESSIONS
        value: "false"
      - key: SEED_ON_BOOT
        value: "true"
